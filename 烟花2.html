<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colorful Fireworks</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
}
canvas{display:block}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
/* ================= 基础设置 ================= */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function resize(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width  = innerWidth  * dpr;
  canvas.height = innerHeight * dpr;
  canvas.style.width  = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize);
resize();

/* ================= 工具函数 ================= */
const rand = (a,b)=>a+Math.random()*(b-a);
const pick = a=>a[(Math.random()*a.length)|0];

/* ================= 绚丽调色板 ================= */
const PALETTE = [
  [255, 80,  80],   // 红
  [255,140, 50],   // 橙
  [255,220, 60],   // 黄
  [120,255,120],   // 绿
  [60, 220,255],   // 青
  [80, 140,255],   // 蓝
  [180,100,255],   // 紫
  [255, 90,200],   // 洋红
  [255,255,255],   // 白高光
];

/* ================= 粒子 ================= */
class Particle{
  constructor(x,y,vx,vy,life,color,size,glow,drag,gravity){
    this.x=x; this.y=y;
    this.vx=vx; this.vy=vy;
    this.life=life; this.age=0;
    this.color=color;
    this.size=size;
    this.glow=glow;
    this.drag=drag;
    this.gravity=gravity;
    this.shift = rand(-40,40); // 颜色扰动
  }
  step(dt){
    this.age+=dt;
    this.vx*=1-this.drag;
    this.vy=this.vy*(1-this.drag)+this.gravity*dt;
    this.x+=this.vx*dt;
    this.y+=this.vy*dt;
  }
  draw(){
    const t = 1 - this.age/this.life;
    if(t<=0) return;

    const [r,g,b] = this.color;
    const speed = Math.hypot(this.vx,this.vy);
    const nx = speed?this.vx/speed:0;
    const ny = speed?this.vy/speed:1;

    const steps = Math.min(20, Math.max(4, speed*0.12|0));
    const spacing = 2.2;

    ctx.globalCompositeOperation = 'lighter';

    for(let i=0;i<steps;i++){
      const k=i/steps;
      const alpha=(1-k)*t;
      const rr = Math.min(255,Math.max(0,r+this.shift*k));
      const gg = Math.min(255,Math.max(0,g+this.shift*(1-k)));
      const rad = this.size*(1.2-k*0.8);

      const px = this.x - nx*i*spacing;
      const py = this.y - ny*i*spacing;

      // 外光
      ctx.beginPath();
      ctx.fillStyle=`rgba(${rr},${gg},${b},${alpha*this.glow*0.35})`;
      ctx.arc(px,py,rad*3.5,0,Math.PI*2);
      ctx.fill();

      // 内光
      ctx.beginPath();
      ctx.fillStyle=`rgba(${rr},${gg},${b},${alpha*this.glow*0.7})`;
      ctx.arc(px,py,rad*2,0,Math.PI*2);
      ctx.fill();

      // 核心点
      ctx.beginPath();
      ctx.fillStyle=`rgba(${rr},${gg},${b},${alpha})`;
      ctx.arc(px,py,rad,0,Math.PI*2);
      ctx.fill();
    }
    ctx.globalCompositeOperation='source-over';
  }
  get dead(){return this.age>=this.life}
}

/* ================= 火箭 ================= */
class Rocket{
  constructor(x,targetY){
    this.x=x;
    this.y=innerHeight+20;
    this.vx=rand(-40,40);
    this.vy=rand(-650,-780);
    this.targetY=targetY;
    this.color=pick(PALETTE);
    this.trail=[];
    this.alive=true;
  }
  step(dt){
    this.trail.push({x:this.x,y:this.y});
    if(this.trail.length>40) this.trail.shift();

    this.vy+=280*dt;
    this.x+=this.vx*dt;
    this.y+=this.vy*dt;

    if(this.y<=this.targetY||this.vy>0){
      this.alive=false;
      explode(this.x,this.y,this.color);
    }
  }
  draw(){
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<this.trail.length;i++){
      const p=this.trail[i];
      const k=i/this.trail.length;
      const [r,g,b]=this.color;
      const a=k*0.6;
      ctx.beginPath();
      ctx.fillStyle=`rgba(${r},${g},${b},${a})`;
      ctx.arc(p.x,p.y,2.5+k*2,0,Math.PI*2);
      ctx.fill();
    }
    ctx.globalCompositeOperation='source-over';
  }
}

/* ================= 爆炸 ================= */
const particles=[];
function explode(x,y,baseColor){
  const count = rand(160,240)|0;
  for(let i=0;i<count;i++){
    const a = rand(0,Math.PI*2);
    const s = rand(260,640);
    const col = Math.random()<0.7?baseColor:pick(PALETTE);
    particles.push(new Particle(
      x,y,
      Math.cos(a)*s,
      Math.sin(a)*s,
      rand(1.3,2.4),
      col,
      rand(1.4,3),
      rand(0.6,1),
      rand(0.02,0.06),
      520
    ));
  }
}

/* ================= 主循环 ================= */
const rockets=[];
let timer=0;
let last=performance.now();

function loop(now){
  const dt=Math.min(0.033,(now-last)/1000);
  last=now;

  // 残影
  ctx.fillStyle='rgba(0,0,0,0.22)';
  ctx.fillRect(0,0,innerWidth,innerHeight);

  timer-=dt;
  if(timer<=0){
    timer=rand(0.3,0.8);
    rockets.push(new Rocket(
      rand(80,innerWidth-80),
      rand(innerHeight*0.2,innerHeight*0.55)
    ));
  }

  for(let i=rockets.length-1;i>=0;i--){
    rockets[i].step(dt);
    rockets[i].draw();
    if(!rockets[i].alive) rockets.splice(i,1);
  }

  for(let i=particles.length-1;i>=0;i--){
    particles[i].step(dt);
    particles[i].draw();
    if(particles[i].dead) particles.splice(i,1);
  }

  requestAnimationFrame(loop);
}

ctx.fillStyle='#000';
ctx.fillRect(0,0,innerWidth,innerHeight);
requestAnimationFrame(loop);

// 点击触发
window.addEventListener('pointerdown',e=>{
  rockets.push(new Rocket(e.clientX, rand(innerHeight*0.2,innerHeight*0.5)));
});
</script>

</body>
</html>
